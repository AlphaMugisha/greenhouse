<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>glasshouse · live climate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <script>
    // Runs before the first paint, so the page never flashes the wrong
    // theme. Saved choice wins; otherwise dark.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("glasshouse-theme"); } catch (e) {}
      document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
    })();
  </script>
</head>
<body>
  <!-- Lives in the static HTML so it is on screen before React boots.
       The app removes it once the first data has landed. -->
  <div class="preloader" id="preloader">
    <div class="preload-inner">
      <span class="preload-mark">glasshouse</span>
      <div class="preload-rule"><span></span></div>
      <span class="preload-status">Connecting to bed 01</span>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
